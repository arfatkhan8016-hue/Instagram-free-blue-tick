<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Instagram</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* Background blurred Instagram icons */
    .bg-icons {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }
    .bg-icon {
      position: absolute;
      font-size: 80px;
      opacity: 0.08;
      animation: float 6s ease-in-out infinite;
    }
    .bg-icon:nth-child(1)  { top: 5%;  left: 8%;  animation-delay: 0s;   font-size: 100px; }
    .bg-icon:nth-child(2)  { top: 15%; right: 10%; animation-delay: 1s;   font-size: 70px;  }
    .bg-icon:nth-child(3)  { top: 40%; left: 3%;  animation-delay: 2s;   font-size: 90px;  }
    .bg-icon:nth-child(4)  { top: 60%; right: 5%; animation-delay: 0.5s; font-size: 85px;  }
    .bg-icon:nth-child(5)  { top: 75%; left: 15%; animation-delay: 1.5s; font-size: 75px;  }
    .bg-icon:nth-child(6)  { top: 85%; right: 20%; animation-delay: 2.5s; font-size: 65px; }
    .bg-icon:nth-child(7)  { top: 30%; left: 40%; animation-delay: 3s;   font-size: 120px; opacity: 0.05; }
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50%       { transform: translateY(-15px) rotate(5deg); }
    }

    /* Main card */
    .card {
      position: relative;
      z-index: 1;
      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 380px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    /* Instagram logo */
    .insta-logo {
      font-size: 64px;
      margin-bottom: 10px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }

    .insta-wordmark {
      font-size: 32px;
      font-weight: 700;
      color: #fff;
      letter-spacing: -0.5px;
      margin-bottom: 18px;
      font-family: 'Georgia', serif;
      text-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* Blue tick congratulations */
    .congrats-box {
      background: rgba(255,255,255,0.15);
      border-radius: 16px;
      padding: 16px 20px;
      margin-bottom: 24px;
      border: 1px solid rgba(255,255,255,0.25);
    }

    .blue-tick-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .blue-tick {
      width: 32px;
      height: 32px;
      background: #1877f2;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(24,119,242,0.6);
    }
    .blue-tick svg {
      width: 18px;
      height: 18px;
      fill: #fff;
    }

    .congrats-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
    }

    .congrats-sub {
      font-size: 13px;
      color: rgba(255,255,255,0.85);
      line-height: 1.5;
    }

    /* Spacer lines */
    .spacer { display: block; height: 10px; }

    /* Open Instagram button style */
    .open-btn {
      display: inline-block;
      background: #fff;
      color: #833ab4;
      font-size: 18px;
      font-weight: 800;
      padding: 16px 48px;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 24px rgba(0,0,0,0.25);
      letter-spacing: 0.3px;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .open-btn:hover  { transform: scale(1.04); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .open-btn:active { transform: scale(0.97); }

    .footer-txt {
      margin-top: 22px;
      font-size: 12px;
      color: rgba(255,255,255,0.6);
    }
  </style>
</head>
<body>

  <!-- Background floating Instagram icons -->
  <div class="bg-icons">
    <span class="bg-icon">📸</span>
    <span class="bg-icon">❤️</span>
    <span class="bg-icon">💬</span>
    <span class="bg-icon">🔔</span>
    <span class="bg-icon">🌟</span>
    <span class="bg-icon">📷</span>
    <span class="bg-icon">📸</span>
  </div>

  <!-- Main card -->
  <div class="card">

    <div class="insta-logo">📸</div>
    <div class="insta-wordmark">Instagram</div>

    <!-- Blue Tick Congratulations box -->
    <div class="congrats-box">
      <div class="blue-tick-row">
        <div class="blue-tick">
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
          </svg>
        </div>
        <span class="congrats-title">Mubarak Ho! 🎉</span>
      </div>
      <div class="congrats-sub">
        Aap nay Instagram ka <strong>Free Blue Tick</strong> jeet liya!<br/>
        Apna account verify karnay kay liye Instagram open karein.
      </div>
    </div>
